<!DOCTYPE html>
<html lang="pt-PT"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="Mope Daily">
<meta name="theme-color" content="#0d0b12"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><link rel="manifest" href="manifest.webmanifest"><link rel="apple-touch-icon" href="icon-180.png"><link rel="icon" href="icon-192.png"><title>Mope Daily</title>
<style>
:root{--bg:#f6f2fb;--card:#fff;--sf:#ece4f8;--tx:#1c1527;--sb:#6e6382;--ac:#7d5bc4;--ok:#2f8f63;--wa:#c98a22;--er:#c8506a;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px)}
:root:not([data-theme="light"]){color-scheme:light}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0d0b12;--card:#1a1623;--sf:#261f33;--tx:#f3eefc;--sb:#a99dc0;--ac:#b79cf0;--ok:#7bd3a6;--wa:#e3a64b;--er:#e07a8a;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0d0b12;--card:#1a1623;--sf:#261f33;--tx:#f3eefc;--sb:#a99dc0;--ac:#b79cf0;--ok:#7bd3a6;--wa:#e3a64b;--er:#e07a8a;color-scheme:dark}
*{box-sizing:border-box}html,body{margin:0}body{background:var(--bg);color:var(--tx);font:16px/1.4 system-ui,-apple-system,"Segoe UI",sans-serif;padding-bottom:calc(80px + env(safe-area-inset-bottom,0px))}
main{max-width:720px;margin:0 auto;padding:16px}
h1{font-size:1.5rem;margin:0}h2{font-size:1.05rem;margin:20px 0 8px}small,.sb{color:var(--sb)}
.card{background:var(--card);border-radius:18px;padding:14px;margin:10px 0}
.row{display:flex;align-items:center;gap:10px}.sp{justify-content:space-between}.g{flex:1;min-width:0}
button,select,input{font:inherit;color:var(--tx);min-height:44px;border-radius:12px;border:1px solid var(--sf);background:var(--sf);padding:0 12px;max-width:100%}
button{cursor:pointer;border:0}button.p{background:var(--ac);color:var(--bg);font-weight:600}button.x{background:none;color:var(--er);min-width:44px}
.chk{width:44px;height:44px;border-radius:50%;border:2px solid var(--ac);background:none;flex:none;font-size:1.1rem;color:var(--bg)}.chk.on{background:var(--ok);border-color:var(--ok)}
.done .t{text-decoration:line-through;opacity:.6}
.tag{font-size:.75rem;background:var(--sf);border-radius:20px;padding:2px 9px;color:var(--sb)}
.ring{width:84px;height:84px;border-radius:50%;display:grid;place-items:center;flex:none}.ring b{background:var(--card);width:66px;height:66px;border-radius:50%;display:grid;place-items:center}
.wk{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;text-align:center}.wk div{background:var(--sf);border-radius:12px;padding:6px 0;font-size:.8rem}.wk .now{outline:2px solid var(--ac)}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;text-align:center}.cal button{min-height:44px;padding:0;background:var(--sf)}.cal button.sel{background:var(--ac);color:var(--bg)}.cal button.dot{box-shadow:inset 0 -3px var(--ac)}
nav{position:fixed;bottom:0;left:0;right:0;background:var(--card);display:flex;padding:6px 6px calc(6px + env(safe-area-inset-bottom,0px));border-top:1px solid var(--sf);z-index:5}
nav button{flex:1;background:none;display:flex;flex-direction:column;align-items:center;font-size:.72rem;color:var(--sb);min-height:50px}nav button.on{color:var(--ac);font-weight:700}nav span{font-size:1.3rem}
.tabs{display:flex;gap:6px;overflow-x:auto}.tabs button{flex:none}.tabs .on{background:var(--ac);color:var(--bg)}
form,.f{display:grid;gap:8px}.f input,.f select{width:100%}.bar{height:8px;background:var(--sf);border-radius:8px;overflow:hidden}.bar i{display:block;height:100%;background:var(--ac)}
.big{font-size:2.2rem;font-variant-numeric:tabular-nums;text-align:center}
</style></head><body><main id="app"></main><nav id="nav"></nav>
<script src="config.js"></script><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script>
const TZ='Europe/Lisbon',DAYS=['segunda-feira','terça-feira','quarta-feira','quinta-feira','sexta-feira','sábado','domingo'],CATS=['Ginásio','Estudos','Igreja','Casa','Hábito','Pessoal'];
const ymd=(d=new Date())=>d.toLocaleDateString('sv-SE',{timeZone:TZ}),pd=s=>new Date(s+'T12:00:00Z'),wd=s=>(pd(s).getUTCDay()+6)%7,addD=(s,n)=>new Date(pd(s).getTime()+n*864e5).toISOString().slice(0,10),diff=(a,b)=>Math.round((pd(a)-pd(b))/864e5),fd=s=>s.split('-').reverse().join('/');
const hr=()=>+new Date().toLocaleString('en-GB',{timeZone:TZ,hour:'2-digit',hour12:false});
const uid=()=>Math.random().toString(36).slice(2,9),fmtT=ms=>{let s=Math.floor(ms/1000),h=Math.floor(s/3600);return(h?h+':':'')+String(Math.floor(s%3600/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0')};
const T0=ymd();
const DEF={name:'Mopeleko',theme:'dark',goal:80,rest:[4],tasks:[
{id:'t1',title:'Arrumar a cama',cat:'Casa',time:'08:00',dur:5,prio:'média',rec:'daily',start:T0},
{id:'t2',title:'Lavar roupa',cat:'Casa',time:'10:00',dur:90,prio:'média',rec:'biweekly',start:T0},
{id:'t3',title:'Devoção da manhã',cat:'Igreja',time:'07:00',dur:35,prio:'alta',rec:'daily',start:T0}],
done:{},gym:{w:[],hist:[],cur:null},study:{subj:[],sess:[],timer:null},cancel:{}};
let S;try{S=JSON.parse(localStorage.getItem('mope'))||DEF}catch(e){S=DEF}
const save=()=>{S.upd=Date.now();try{localStorage.setItem('mope',JSON.stringify(S))}catch(e){}push()};
const CFG=window.MOPE_CFG||{},SY={out:'Sem sessão',pend:'A aguardar…',sync:'A sincronizar…',ok:'Sincronizado ✓',err:'Erro de sincronização',off2:'Offline: guardado neste aparelho'};
let sb=null,user=null,pt,sync={s:'out'};
const stat=()=>{const e=document.getElementById('sy');if(e)e.textContent=SY[sync.s]};
if(CFG.url&&CFG.key&&window.supabase){sb=supabase.createClient(CFG.url,CFG.key);
sb.auth.getSession().then(({data})=>{user=data.session&&data.session.user;if(user)pull();else draw()});
sb.auth.onAuthStateChange((e,s)=>{user=s&&s.user;if(e=='PASSWORD_RECOVERY'){const p=prompt('Nova palavra-passe (mínimo 6 caracteres):');if(p)sb.auth.updateUser({password:p}).then(r=>alert(r.error?r.error.message:'Palavra-passe atualizada.'))}})}
function push(){if(!sb||!user)return;clearTimeout(pt);sync.s='pend';stat();pt=setTimeout(async()=>{if(!navigator.onLine){sync.s='off2';stat();return}sync.s='sync';stat();try{const{error}=await sb.from('app_state').upsert({user_id:user.id,data:S,updated_at:new Date(S.upd).toISOString()});sync.s=error?'err':'ok'}catch(e){sync.s='err'}stat()},1500)}
async function pull(){sync.s='sync';try{const{data,error}=await sb.from('app_state').select('data,updated_at').eq('user_id',user.id).maybeSingle();if(error)throw error;
if(data&&new Date(data.updated_at).getTime()>(S.upd||0)){S=data.data;S.upd=new Date(data.updated_at).getTime();ensure();try{localStorage.setItem('mope',JSON.stringify(S))}catch(e){}sync.s='ok'}else{push();sync.s='ok'}}catch(e){sync.s='err'}draw()}
addEventListener('online',()=>push());addEventListener('offline',()=>{sync.s='off2';stat()});
const lg=async m=>{const email=V('a_e').trim(),password=V('a_p')||'';if(!email||(m!='r'&&!password)){alert('Preenche o email e a palavra-passe.');return}let r;
if(m=='in')r=await sb.auth.signInWithPassword({email,password});else if(m=='up')r=await sb.auth.signUp({email,password});else r=await sb.auth.resetPasswordForEmail(email,{redirectTo:location.href.split('#')[0]});
if(r.error){alert('Erro: '+r.error.message);return}if(m=='r'){alert('Enviámos um email para repores a palavra-passe.');return}if(m=='up'&&!r.data.session){alert('Conta criada. Confirma o email e depois entra.');return}user=r.data.session.user;await pull()};
const lo=async()=>{await sb.auth.signOut();user=null;sync.s='out';draw()};
const acct=()=>`<h2>Conta e sincronização</h2><div class="card f">${!sb?'<small>Sincronização não configurada. Segue o LEIA-ME.md (config.js + Supabase) para teres login e os dados em todos os aparelhos.</small>':user?`<small>Sessão: ${esc(user.email||'')}</small><b id="sy">${SY[sync.s]}</b><button onclick="push()">Sincronizar agora</button><button onclick="lo()">Terminar sessão</button>`:'<input id="a_e" type="email" placeholder="Email" autocomplete="email"><input id="a_p" type="password" placeholder="Palavra-passe" autocomplete="current-password"><button class="p" onclick="lg(\'in\')">Entrar</button><button onclick="lg(\'up\')">Criar conta</button><button onclick="lg(\'r\')">Esqueci a palavra-passe</button>'}</div>`;
function ensure(){S.sd=S.sd||{};S.nt=S.nt||{};S.dev=S.dev||{acts:[{n:'Oração',m:10},{n:'Leitura bíblica',m:15},{n:'Meditação',m:10}],cur:null,hist:[]}}ensure();
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const ios=/iphone|ipad/i.test(navigator.userAgent),standalone=navigator.standalone||matchMedia('(display-mode: standalone)').matches;
const hint=()=>ios&&!standalone&&!S.hint?`<div class="card">📲 <b>Instala no iPhone</b><br><small>No Safari: Partilhar → Adicionar ao ecrã principal → Adicionar.</small><br><button onclick="S.hint=1;save();draw()">Entendi</button></div>`:'';
let ui={tab:'home',sub:'Igreja',sel:T0,cm:T0.slice(0,7),form:false,fcat:'Pessoal',gv:null};
const rest=d=>S.rest.includes(wd(d));
const occ=(t,d)=>{if(d<t.start)return false;const k=diff(d,t.start);return t.rec=='none'?k==0:t.rec=='daily'?true:t.rec=='weekly'?k%7==0:t.rec=='biweekly'?k%14==0:d.slice(8)==t.start.slice(8)};
const dayT=d=>S.tasks.filter(t=>occ(t,d)&&!S.cancel[d+'|'+t.id]);
const dstat=d=>{const l=dayT(d);return{n:l.length,c:l.filter(t=>S.done[d+'|'+t.id]).length}};
const pct=d=>{const s=dstat(d);return s.n?Math.round(s.c/s.n*100):0};
function streaks(){let run=0,best=0,first=S.tasks.reduce((a,t)=>t.start<a?t.start:a,T0),active=0;for(let d=first;d<=T0;d=addD(d,1)){const s=dstat(d);if(s.c)active++;if(rest(d)||!s.n)continue;if(pct(d)>=S.goal){run++;best=Math.max(best,run)}else if(d!=T0)run=0}return{cur:run,best,active}}
function ach(){const s=streaks(),tot=Object.keys(S.done).length;return[['Primeiro dia concluído',s.best>=1],['3 dias seguidos',s.best>=3],['7 dias seguidos',s.best>=7],['14 dias seguidos',s.best>=14],['30 dias seguidos',s.best>=30],['100 tarefas concluídas',tot>=100],['Primeiro treino',S.gym.hist.length>0],['Primeira sessão de estudo',S.study.sess.length>0]]}
const go=(t,s)=>{ui.tab=t;if(s)ui.sub=s;ui.form=false;ui.edit=null;draw()};
const tog=(d,id)=>{const k=d+'|'+id;S.done[k]?delete S.done[k]:S.done[k]=Date.now();save();draw()};
const rm=id=>{if(confirm('Eliminar esta tarefa e o seu agendamento?')){S.tasks=S.tasks.filter(t=>t.id!=id);save();draw()}};
const V=id=>document.getElementById(id).value;
function addTask(){const title=V('f_t').trim();if(!title){alert('Escreve um título.');return}const o={title,cat:V('f_c'),start:V('f_d')||T0,time:V('f_h')||'',dur:+V('f_u')||15,prio:V('f_p'),rec:V('f_r')},t=ui.edit&&S.tasks.find(x=>x.id==ui.edit);if(t)Object.assign(t,o);else S.tasks.push({id:uid(),...o});ui.form=false;ui.edit=null;save();draw()}
const opt=(a,v)=>a.map(x=>`<option ${x==v?'selected':''}>${x}</option>`).join('');
const RL=[['none','Sem repetição'],['daily','Diária'],['weekly','Semanal'],['biweekly','De 14 em 14 dias'],['monthly','Mensal']];
const form=(cat,d)=>{const t=ui.edit&&S.tasks.find(x=>x.id==ui.edit),v=t||{};return ui.form||t?`<div class="card f" id="tform"><b>${t?'Editar tarefa':'Nova tarefa'}</b><input id="f_t" placeholder="Título" maxlength="80" value="${esc(v.title||'')}"><select id="f_c">${opt(CATS,v.cat||cat)}</select><input id="f_d" type="date" value="${v.start||d}"><input id="f_h" type="time" value="${v.time||''}"><input id="f_u" type="number" min="1" placeholder="Duração (min)" value="${v.dur||''}"><select id="f_p">${opt(['alta','média','baixa'],v.prio||'média')}</select><select id="f_r">${RL.map(a=>`<option value="${a[0]}" ${a[0]==(v.rec||'none')?'selected':''}>${a[1]}</option>`).join('')}</select><button class="p" onclick="addTask()">Guardar</button><button onclick="ui.form=false;ui.edit=null;draw()">Cancelar</button></div>`:`<button class="p" style="width:100%" onclick="ui.form=true;draw()">+ Nova tarefa</button>`};
const tgo=k=>{ui.open=ui.open==k?null:k;draw()};
const sdt=(d,t,i)=>{const k=d+'|'+t+'|'+i;S.sd[k]?delete S.sd[k]:S.sd[k]=1;save();draw()};
const sadd2=id=>{const x=V('sn').trim();if(!x)return;const t=S.tasks.find(y=>y.id==id);(t.sub=t.sub||[]).push({i:uid(),x});save();draw()};
const sdel2=(id,i)=>{const t=S.tasks.find(y=>y.id==id);t.sub=t.sub.filter(y=>y.i!=i);save();draw()};
const edt=id=>{ui.edit=id;draw();const e=document.getElementById('tform');e&&e.scrollIntoView({block:'center'})};
const taskRow=(t,d)=>{const ok=d+'|'+t.id,on=S.done[ok],late=!on&&d<T0,sub=t.sub||[],sc=sub.filter(x=>S.sd[ok+'|'+x.i]).length,op=ui.open==ok;
return`<div class="card ${on?'done':''}"><div class="row"><button class="chk ${on?'on':''}" aria-label="Concluir" onclick="tog('${d}','${t.id}')">${on?'✓':''}</button><div class="g"><div class="t">${esc(t.title)}</div><small>${t.time||'sem hora'} · ${t.dur} min · <span class="tag">${t.cat}</span> <span class="tag">${t.prio}</span>${sub.length?' <span class="tag">☑ '+sc+'/'+sub.length+'</span>':''}${late?' <span class="tag" style="color:var(--er)">em atraso</span>':''}</small></div><button class="x" style="color:var(--sb)" aria-label="Lista de itens" onclick="tgo('${ok}')">☰</button><button class="x" style="color:var(--sb)" aria-label="Editar" onclick="edt('${t.id}')">✎</button></div>${op?`<div class="f" style="margin-top:8px">${sub.map(x=>`<div class="row ${S.sd[ok+'|'+x.i]?'done':''}"><button class="chk ${S.sd[ok+'|'+x.i]?'on':''}" onclick="sdt('${d}','${t.id}','${x.i}')">${S.sd[ok+'|'+x.i]?'✓':''}</button><span class="t g">${esc(x.x)}</span><button class="x" onclick="sdel2('${t.id}','${x.i}')">✕</button></div>`).join('')}<div class="row"><input id="sn" class="g" placeholder="Novo item da lista"><button onclick="sadd2('${t.id}')">+</button></div></div>`:''}</div>`};
const lst=d=>{const l=dayT(d).sort((a,b)=>(a.time||'99').localeCompare(b.time||'99'));return l.length?l.map(t=>taskRow(t,d)).join(''):'<div class="card sb">Sem atividades neste dia. Cria a primeira com “Nova tarefa”.</div>'};
function home(){const d=T0,s=dstat(d),p=pct(d),st=streaks(),g=hr()<12?'Bom dia':hr()<20?'Boa tarde':'Boa noite',mon=addD(d,-wd(d));
let w='';for(let i=0;i<7;i++){const x=addD(mon,i),r=rest(x),ok=pct(x)>=S.goal&&dstat(x).n;w+=`<div class="${x==d?'now':''}">${DAYS[i].slice(0,3)}<br>${r?'🌙':x>d?'·':ok?'✓':'○'}</div>`}
const first=dayT(d).filter(t=>!S.done[d+'|'+t.id]).sort((a,b)=>({alta:0,média:1,baixa:2}[a.prio]-{alta:0,média:1,baixa:2}[b.prio]))[0];
return`<h1>${g}, ${S.name}!</h1><small>${DAYS[wd(d)]}, ${fd(d)}${rest(d)?' · dia de descanso 🌙':''}${sb&&user?' · <span id="sy">'+SY[sync.s]+'</span>':''}</small>
${hint()}<div class="card row"><div class="ring" style="background:conic-gradient(var(--ac) ${p*3.6}deg,var(--sf) 0)"><b>${p}%</b></div><div class="g"><b>${s.c} de ${s.n} concluídas</b><br><small>Meta diária: ${S.goal}%</small></div><div style="text-align:center">🔥<br><b>${st.cur}</b></div></div>
<h2>Foco de hoje</h2>${first?taskRow(first,d):'<div class="card sb">Tudo feito por hoje. Descansa, Mopeleko. 💜</div>'}
<h2>Semana</h2><div class="wk">${w}</div><h2>Hoje</h2>${lst(d)}${form('Pessoal',d)}`}
function gym(){const g=S.gym;if(g.cur){const w=g.w.find(x=>x.id==g.cur.w),tot=w.ex.reduce((a,e)=>a+e.sets,0),dn=Object.keys(g.cur.sets).length;
return`<h1>${w.name}</h1><div class="big" id="gt">${fmtT(Date.now()-g.cur.start)}</div><div class="bar"><i style="width:${tot?dn/tot*100:0}%"></i></div><small>${dn}/${tot} séries</small><div class="card row sp"><span>⏱️ Descanso <b id="rt">${rl()}</b></span><span><button onclick="gr(60)">60s</button> <button onclick="gr(90)">90s</button> <button onclick="S.gym.cur.rest=0;save();draw()">Parar</button></span></div>
${w.ex.map((e,i)=>`<div class="card"><b>${e.n}</b> <small>${e.sets}×${e.reps}</small><div class="row" style="margin:8px 0;flex-wrap:wrap">${Array.from({length:e.sets},(_,j)=>`<button class="${g.cur.sets[i+'-'+j]?'p':''}" onclick="gset('${i}-${j}')">${j+1}</button>`).join('')}<input type="number" style="width:90px" placeholder="kg" value="${g.cur.wt[i]||''}" onchange="S.gym.cur.wt[${i}]=this.value;save()"></div></div>`).join('')}
<button class="p" style="width:100%" onclick="gfin()">Terminar treino</button> <button class="x" onclick="if(confirm('Cancelar treino?')){S.gym.cur=null;save();draw()}">Cancelar</button>`}
const sel=g.w.find(x=>x.id==ui.gv);
return`<h1>Ginásio</h1><h2>Os meus treinos</h2>${g.w.map(w=>`<div class="card"><div class="row sp"><b>${w.name}</b><span><button class="p" ${w.ex.length?'':'disabled'} onclick="gstart('${w.id}')">Iniciar</button><button class="x" onclick="gdel('${w.id}')">✕</button></span></div><small>${w.ex.map(e=>e.n+' '+e.sets+'×'+e.reps).join(' · ')||'Sem exercícios'}</small><div><button onclick="ui.gv='${w.id}';draw()">+ exercício</button></div>${sel&&sel.id==w.id?`<div class="f"><input id="e_n" placeholder="Exercício"><input id="e_s" type="number" placeholder="Séries"><input id="e_r" type="number" placeholder="Repetições"><button class="p" onclick="gex('${w.id}')">Adicionar</button></div>`:''}</div>`).join('')||'<div class="card sb">Ainda não tens treinos. Cria o teu plano, sem regras fixas.</div>'}
<div class="card f"><input id="w_n" placeholder="Nome do treino (ex.: Pernas)"><button class="p" onclick="gadd()">Criar treino</button></div>
<h2>Histórico</h2>${g.hist.slice().reverse().map(h=>`<div class="card"><b>${h.name}</b> · ${fd(h.date)}<br><small>${fmtT(h.secs)} · ${h.done}/${h.total} séries</small></div>`).join('')||'<div class="card sb">Os treinos concluídos aparecem aqui.</div>'}`}
const gadd=()=>{const n=V('w_n').trim();if(n){S.gym.w.push({id:uid(),name:n,ex:[]});save();draw()}};
const gdel=id=>{if(confirm('Eliminar treino?')){S.gym.w=S.gym.w.filter(w=>w.id!=id);save();draw()}};
const gex=id=>{const n=V('e_n').trim();if(!n)return;S.gym.w.find(w=>w.id==id).ex.push({n,sets:+V('e_s')||3,reps:+V('e_r')||10});ui.gv=null;save();draw()};
const gstart=id=>{S.gym.cur={w:id,start:Date.now(),sets:{},wt:{}};save();draw()};
const rl=()=>{const r=S.gym.cur&&S.gym.cur.rest,l=r?r-Date.now():0;return l>0?fmtT(l):'—'};
const gr=s=>{S.gym.rs=s;S.gym.cur.rest=Date.now()+s*1000;save();draw()};
const gset=k=>{const c=S.gym.cur,s=c.sets;if(s[k])delete s[k];else{s[k]=1;c.rest=Date.now()+(S.gym.rs||60)*1000}save();draw()};
const gfin=()=>{const c=S.gym.cur,w=S.gym.w.find(x=>x.id==c.w);S.gym.hist.push({date:T0,name:w.name,secs:Math.floor((Date.now()-c.start)/1000),done:Object.keys(c.sets).length,total:w.ex.reduce((a,e)=>a+e.sets,0),wt:c.wt});S.gym.cur=null;save();draw()};
const tEl=()=>{const t=S.study.timer;return t?t.acc+(t.at?Date.now()-t.at:0):0};
function study(){const st=S.study,t=st.timer,mon=addD(T0,-wd(T0));
const wk=id=>st.sess.filter(x=>x.s==id&&x.d>=mon).reduce((a,x)=>a+x.secs,0),totAll=st.sess.reduce((a,x)=>a+x.secs,0);
return`<h1>Estudos</h1><small>${rest(T0)&&wd(T0)==4?'Sexta-feira é dia de descanso académico 🌙':'Foco, sem pressa.'}</small>
<div class="card"><select id="s_s" ${t?'disabled':''}>${st.subj.map(x=>`<option value="${x.id}" ${t&&t.s==x.id?'selected':''}>${x.name}</option>`).join('')}</select>
<div class="big" id="st">${fmtT(tEl())}</div><div class="row" style="flex-wrap:wrap;justify-content:center">${!t?'<button class="p" onclick="sstart()">Iniciar</button>':(t.at?'<button onclick="spause()">Pausar</button>':'<button class="p" onclick="sresume()">Retomar</button>')+'<button class="p" onclick="sfin()">Terminar</button><button onclick="sreset()">Repor</button>'}</div></div>
<h2>Estatísticas</h2><div class="card">Total: <b>${(totAll/3600).toFixed(1)} h</b> · Sessões: <b>${st.sess.length}</b></div>
${st.subj.map(x=>{const w=wk(x.id),p=Math.min(100,w/(x.target*36));return`<div class="card"><div class="row sp"><b>${x.name}</b><button class="x" onclick="sdel('${x.id}')">✕</button></div><small>${(w/3600).toFixed(1)} h esta semana de ${x.target} h</small><div class="bar"><i style="width:${p}%"></i></div></div>`}).join('')||'<div class="card sb">Adiciona a tua primeira disciplina.</div>'}
<div class="card f"><input id="d_n" placeholder="Disciplina"><input id="d_t" type="number" placeholder="Meta semanal (horas)"><button class="p" onclick="sadd()">Adicionar disciplina</button></div>`}
const sadd=()=>{const n=V('d_n').trim();if(n){S.study.subj.push({id:uid(),name:n,target:+V('d_t')||5});save();draw()}};
const sdel=id=>{if(confirm('Eliminar disciplina?')){S.study.subj=S.study.subj.filter(x=>x.id!=id);save();draw()}};
const sstart=()=>{const s=V('s_s');if(!s){alert('Cria primeiro uma disciplina.');return}S.study.timer={s,acc:0,at:Date.now()};save();draw()};
const spause=()=>{const t=S.study.timer;t.acc+=Date.now()-t.at;t.at=null;save();draw()};
const sresume=()=>{S.study.timer.at=Date.now();save();draw()};
const sfin=()=>{const e=Math.floor(tEl()/1000),t=S.study.timer;if(e>0)S.study.sess.push({s:t.s,d:T0,secs:e});S.study.timer=null;save();draw()};
const sreset=()=>{if(confirm('Repor o cronómetro?')){S.study.timer=null;save();draw()}};
function rotina(){const subs=['Igreja','Casa','Hábitos','Calendário'],tabs=`<div class="tabs">${subs.map(s=>`<button class="${ui.sub==s?'on':''}" onclick="ui.sub='${s}';ui.form=false;draw()">${s}</button>`).join('')}</div>`;
if(ui.sub=='Calendário'){const[y,m]=ui.cm.split('-').map(Number),f=`${ui.cm}-01`,off=wd(f),n=new Date(y,m,0).getDate(),nm=new Date(Date.UTC(y,m-1,1)).toLocaleDateString('pt-PT',{month:'long',year:'numeric',timeZone:'UTC'});
let c=DAYS.map(x=>`<small>${x[0].toUpperCase()}</small>`).join('')+'<span></span>'.repeat(off);for(let i=1;i<=n;i++){const d=`${ui.cm}-${String(i).padStart(2,'0')}`;c+=`<button class="${d==ui.sel?'sel':''} ${dayT(d).length?'dot':''}" onclick="ui.sel='${d}';draw()">${i}</button>`}
const nx=k=>{const dt=new Date(Date.UTC(y,m-1+k,1));return dt.toISOString().slice(0,7)};
return`<h1>Rotina</h1>${tabs}<div class="row sp" style="margin-top:12px"><button onclick="ui.cm='${nx(-1)}';draw()">‹</button><b>${nm}</b><button onclick="ui.cm='${nx(1)}';draw()">›</button></div><div class="cal card">${c}</div><h2>${DAYS[wd(ui.sel)]}, ${fd(ui.sel)}</h2>${lst(ui.sel)}${form('Pessoal',ui.sel)}`}
const cat=ui.sub=='Hábitos'?'Hábito':ui.sub,l=S.tasks.filter(t=>t.cat==cat),R={none:'única',daily:'diária',weekly:'semanal',biweekly:'de 14 em 14 dias',monthly:'mensal'};
return`<h1>Rotina · ${ui.sub}</h1>${tabs}<h2>Agendamentos</h2>${l.map(t=>`<div class="card row"><div class="g"><b>${t.title}</b><br><small>${R[t.rec]} · desde ${fd(t.start)} ${t.time}</small></div><button class="x" style="color:var(--sb)" aria-label="Editar" onclick="edt('${t.id}')">✎</button><button class="x" onclick="rm('${t.id}')">✕</button></div>`).join('')||'<div class="card sb">Ainda sem itens nesta área.</div>'}<h2>Hoje</h2>${dayT(T0).filter(t=>t.cat==cat).map(t=>taskRow(t,T0)).join('')||'<div class="card sb">Nada para hoje.</div>'}${form(cat,T0)}${ui.sub=='Igreja'?dev():''}`}
function dev(){const d=S.dev,c=d.cur;
if(c)return`<h2>Devoção em curso</h2><div class="card"><div class="big" id="dt">${fmtT(Date.now()-c.start)}</div>${d.acts.map((a,i)=>`<div class="row ${c.d[i]?'done':''}"><button class="chk ${c.d[i]?'on':''}" onclick="dtog(${i})">${c.d[i]?'✓':''}</button><span class="t g">${esc(a.n)} · ${a.m} min</span></div>`).join('')}<textarea id="dn" rows="3" style="width:100%;border-radius:12px;background:var(--sf);color:var(--tx);border:0;padding:10px;font:inherit;margin:8px 0" placeholder="Reflexão pessoal (privada)">${esc(c.note||'')}</textarea><div class="row"><button class="p" onclick="dfin()">Terminar</button><button class="x" onclick="S.dev.cur=null;save();draw()">Cancelar</button></div></div>`;
return`<h2>Devoção</h2><div class="card">${d.acts.map((a,i)=>`<div class="row sp"><span>${esc(a.n)}</span><span><input type="number" min="1" style="width:70px" value="${a.m}" onchange="S.dev.acts[${i}].m=+this.value||1;save()"> min <button class="x" onclick="S.dev.acts.splice(${i},1);save();draw()">✕</button></span></div>`).join('')}<div class="row"><input id="da" placeholder="Nova atividade" class="g"><button onclick="dadd()">+</button></div><button class="p" style="width:100%;margin-top:8px" onclick="S.dev.cur={start:Date.now(),d:{}};save();draw()">Iniciar devoção</button></div>${d.hist.slice(-5).reverse().map(x=>`<div class="card"><b>${fd(x.date)}</b> · ${fmtT(x.secs*1000)} · ${x.done}/${x.total}<br><small>${esc(x.note||'sem notas')}</small></div>`).join('')}`}
const dadd=()=>{const n=V('da').trim();if(n){S.dev.acts.push({n,m:10});save();draw()}};
const dtog=i=>{const c=S.dev.cur;c.note=V('dn');c.d[i]?delete c.d[i]:c.d[i]=1;save();draw()};
const dfin=()=>{const c=S.dev.cur;S.dev.hist.push({date:T0,secs:Math.floor((Date.now()-c.start)/1000),done:Object.keys(c.d).length,total:S.dev.acts.length,note:V('dn')});S.dev.cur=null;save();draw()};
function bars(n){let x='';for(let i=n-1;i>=0;i--){const d=addD(T0,-i),p=pct(d);x+=`<div title="${fd(d)}" style="flex:1;display:flex;flex-direction:column;justify-content:flex-end;height:80px"><i style="display:block;height:${Math.max(p,4)}%;background:${rest(d)?'var(--sf)':p>=S.goal?'var(--ok)':'var(--ac)'};border-radius:4px"></i></div>`}return`<div style="display:flex;gap:3px">${x}</div>`}
const cons=n=>{let a=0,b=0;for(let i=0;i<n;i++){const d=addD(T0,-i),s=dstat(d);if(rest(d)||!s.n)continue;b++;if(pct(d)>=S.goal)a++}return b?Math.round(a/b*100):0};
const catS=()=>CATS.map(c=>{const ids=S.tasks.filter(t=>t.cat==c).map(t=>t.id);return c+': '+Object.keys(S.done).filter(k=>ids.includes(k.split('|')[1])).length}).join(' · ');
function perfil(){const st=streaks(),a=ach();return`<h1>Perfil</h1><div class="card f"><label>Nome<input id="p_n" value="${S.name}" onchange="S.name=this.value;save()"></label><label>Tema<select onchange="S.theme=this.value;save();draw()"><option value="dark" ${S.theme=='dark'?'selected':''}>Preto e lilás (escuro)</option><option value="light" ${S.theme=='light'?'selected':''}>Lilás claro</option></select></label><label>Meta diária (%)<input type="number" min="10" max="100" value="${S.goal}" onchange="S.goal=Math.min(100,Math.max(10,+this.value||80));save();draw()"></label><b>Dias de descanso</b><div class="row" style="flex-wrap:wrap">${DAYS.map((x,i)=>`<label class="row"><input type="checkbox" style="min-height:auto" ${S.rest.includes(i)?'checked':''} onchange="trest(${i})">${x.slice(0,3)}</label>`).join('')}</div></div>
<h2>🔥 Consistência</h2><div class="card">Atual: <b>${st.cur}</b> · Maior: <b>${st.best}</b> · Dias ativos: <b>${st.active}</b></div>
<h2>Estatísticas</h2><div class="card"><small>Últimos 14 dias (verde = meta cumprida, roxo claro = em progresso, escuro = descanso)</small>${bars(14)}<small>Consistência: semana ${cons(7)}% · mês ${cons(30)}%</small><br><small>Concluídas por categoria — ${catS()}</small></div><h2>Conquistas</h2>${a.map(x=>`<div class="card row"><span>${x[1]?'🏆':'🔒'}</span><span class="${x[1]?'':'sb'}">${x[0]}</span></div>`).join('')}
${acct()}${notifCard()}<h2>Dados</h2><div class="card row" style="flex-wrap:wrap"><button class="p" onclick="exp()">Exportar JSON</button><button onclick="document.getElementById('imp').click()">Importar</button><input id="imp" type="file" accept=".json" hidden onchange="imp(this)"><button class="x" onclick="if(confirm('Apagar todos os dados?')){localStorage.removeItem('mope');location.reload()}">Apagar tudo</button></div><small>Os dados ficam guardados neste dispositivo. Exporta regularmente.</small>`}
const notifCard=()=>{let b;if(!('Notification'in window))b='<small>Este navegador não suporta notificações.</small>';else if(ios&&!standalone)b='<small>No iPhone, instala primeiro a app no ecrã principal (Partilhar → Adicionar ao ecrã principal) e abre-a a partir daí.</small>';else if(Notification.permission=='denied')b='<small>As notificações estão bloqueadas nas definições do navegador.</small>';else b=`<button class="${S.notif?'':'p'}" onclick="ntog()">${S.notif?'Desativar lembretes':'Ativar lembretes'}</button>`;return`<h2>Lembretes</h2><div class="card f">${b}<small>Avisam à hora de cada tarefa, mas só com a app aberta ou em segundo plano. Avisos com a app fechada precisam de um servidor push (próximo passo).</small></div>`};
async function ntog(){if(S.notif){S.notif=false;save();draw();return}const p=await Notification.requestPermission();if(p=='granted')S.notif=true;else alert('Sem permissão, os lembretes não podem ser ativados.');save();draw()}
function rem(){if(!S.notif||!('Notification'in window)||Notification.permission!='granted')return;const hm=new Date().toLocaleTimeString('en-GB',{timeZone:TZ,hour:'2-digit',minute:'2-digit'});dayT(T0).forEach(t=>{const k=T0+'|'+t.id;if(t.time==hm&&!S.done[k]&&!S.nt[k]){S.nt[k]=1;save();const o={body:t.cat+' · '+t.dur+' min',icon:'icon-192.png'};navigator.serviceWorker&&navigator.serviceWorker.ready?navigator.serviceWorker.ready.then(r=>r.showNotification(t.title,o)).catch(()=>new Notification(t.title,o)):new Notification(t.title,o)}})}
setInterval(rem,20000);
const trest=i=>{S.rest=S.rest.includes(i)?S.rest.filter(x=>x!=i):[...S.rest,i];save()};
const exp=()=>{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(S)],{type:'application/json'}));a.download='mope-daily-'+T0+'.json';a.click()};
const imp=el=>{const r=new FileReader();r.onload=()=>{try{const o=JSON.parse(r.result);if(!o.tasks)throw 0;S=o;save();draw()}catch(e){alert('Ficheiro inválido.')}};r.readAsText(el.files[0])};
const TABS=[['home','Início','🏠'],['gym','Ginásio','🏋️'],['study','Estudos','📖'],['rot','Rotina','🗓️'],['me','Perfil','💜']];
function draw(){document.documentElement.dataset.theme=S.theme;const v={home,gym,study,rot:rotina,me:perfil}[ui.tab];document.getElementById('app').innerHTML=v();document.getElementById('nav').innerHTML=TABS.map(t=>`<button class="${ui.tab==t[0]?'on':''}" onclick="go('${t[0]}')"><span>${t[2]}</span>${t[1]}</button>`).join('')}
setInterval(()=>{const a=document.getElementById('st'),b=document.getElementById('gt'),e=document.getElementById('dt'),c=S.gym.cur;if(a)a.textContent=fmtT(tEl());if(b&&c)b.textContent=fmtT(Date.now()-c.start);if(e&&S.dev.cur)e.textContent=fmtT(Date.now()-S.dev.cur.start);if(c&&c.rest){if(Date.now()>=c.rest){c.rest=0;save();navigator.vibrate&&navigator.vibrate([200,100,200]);draw()}else{const r=document.getElementById('rt');if(r)r.textContent=rl()}}},500);
document.addEventListener('visibilitychange',()=>{if(!document.hidden)draw()});
draw();
if("serviceWorker"in navigator)addEventListener("load",()=>navigator.serviceWorker.register("sw.js").catch(()=>{}));
</script></body></html>
